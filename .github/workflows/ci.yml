name: check
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: 凭据自检（禁止会话/HAR/Cookie 入库）
        run: python3 check_no_secrets.py
      - name: 离线测试
        run: python3 -m unittest -v test_thuwj.py test_import_session.py
